{% extends "base.html" %}

{% block content %}
  <h1>Cook List
    <a style="float: right" href="{% url "kitchen:cook-create" %}" class="btn btn-primary link-to-page">+</a>
  </h1>
  <table class="table">
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>Email</th>
      <th>First Name</th>
      <th>Last Name</th>
    </tr>
    {% for cook in cook_list %}
      <tr>
        <td><a href="{% url 'kitchen:cook-detail' pk=cook.id %}">{{ cook.id }}</a></td>
        <td>{{ cook.username }}</td>
        <td>{{ cook.email }}</td>
        <td>{{ cook.first_name }}</td>
        <td>{{ cook.last_name }}</td>
      </tr>
    {% endfor %}
  </table>
{% endblock %}
